[package]
name = "uniffi-bindgen"
version = "0.0.0"
edition = "2024"
publish = false

[[bin]]
name = "uniffi-bindgen"
path = "src/main.rs"

[dependencies]
# Must match the version pin in `threema-gateway-ffi/Cargo.toml`.
# Mismatches surface as checksum failures at foreign-side import time, not at `cargo check`.
uniffi = { version = "=0.31.2", features = ["cli"] }
