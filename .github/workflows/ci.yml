on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "30 3 * * 2"

name: CI

env:
  RUST_VERSION: "1.91.0"

jobs:
  test:
    name: run tests
    strategy:
      matrix:
        rust: [$RUST_VERSION, stable]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ matrix.rust }}
      - name: Build with default features
        run: cargo build --all-targets
      - name: Build without default features
        run: cargo build --no-default-features
      - name: Build with all features
        run: cargo build --all-targets --all-features
      - name: Run tests
        run: cargo test --all-features

  fmt:
    name: run rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: $RUST_VERSION
          components: rustfmt
      - name: Check formatting in all files
        run: cargo fmt --all -- --check

  clippy:
    name: run clippy lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "${RUST_VERSION}"
          components: clippy
      - name: Check if there are clippy warnings
        run: cargo clippy --all-features -- -D warnings

  coverage:
    name: measure coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Measure code coverage
        run: |
          cargo llvm-cov --all-features --lcov --output-path lcov.info
          cargo llvm-cov report --summary-only > /tmp/coverage.txt
          cat /tmp/coverage.txt
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/coverage.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: true

  audit:
    name: run cargo audit
    runs-on: ubuntu-latest
    container: dbrgn/cargo-audit:latest
    steps:
      - uses: actions/checkout@v6
      - name: Audit all used dependencies
        run: cargo audit
