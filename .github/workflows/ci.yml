on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "30 3 * * 2"

name: CI

env:
  RUST_VERSION: "1.91.0"

jobs:
  test:
    name: run tests
    strategy:
      matrix:
        rust: [$RUST_VERSION, stable]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ matrix.rust }}
      - name: Build with default features
        run: cargo build --workspace --all-targets
      - name: Build without default features
        run: cargo build --workspace --no-default-features
      - name: Build with all features
        run: cargo build --workspace --all-targets --all-features
      - name: Run tests
        run: cargo test --workspace --all-features

  fmt:
    name: run rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: $RUST_VERSION
          components: rustfmt
      - name: Check formatting in all files
        run: cargo fmt --all -- --check

  clippy:
    name: run clippy lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "${RUST_VERSION}"
          components: clippy
      - name: Check if there are clippy warnings
        run: cargo clippy --workspace --all-features -- -D warnings

  coverage:
    name: measure coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Measure code coverage
        run: |
          cargo llvm-cov -p threema-gateway --all-features --lcov --output-path lcov.info
          cargo llvm-cov -p threema-gateway report --summary-only > /tmp/coverage.txt
          cat /tmp/coverage.txt
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/coverage.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage to Codecov
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: true

  audit:
    name: run cargo audit
    runs-on: ubuntu-latest
    container: dbrgn/cargo-audit:latest
    steps:
      - uses: actions/checkout@v6
      - name: Audit all used dependencies
        run: cargo audit

  ffi-bindings:
    name: verify FFI bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: $RUST_VERSION
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Build FFI cdylib
        run: cargo build -p threema-gateway-ffi
      - name: Regenerate Python bindings
        # `uniffi-bindgen` lives outside the workspace, so it needs its own manifest path.
        # Must use the same uniffi version as the FFI crate (both pinned to =0.31.2).
        run: |
          cargo run --manifest-path uniffi-bindgen/Cargo.toml -- \
            generate --library target/debug/libthreema_gateway_ffi.so \
            --language python \
            --out-dir bindings/python/
      - name: Verify checked-in bindings match source
        # If this fails, the FFI surface changed without regenerating the foreign-side bindings.
        # Run the command above locally and commit the regenerated files.
        run: |
          if ! git diff --exit-code bindings/; then
            echo "::error::FFI surface changed but bindings/ was not regenerated. See bindings/README.md."
            exit 1
          fi
      - name: Smoke test Python bindings
        # Loading the module runs uniffi's contract-version check; we also explicitly invoke the
        # per-function checksum verifier (it's generated but commented out by default in the .py).
        working-directory: bindings/python
        run: |
          cp ../../target/debug/libthreema_gateway_ffi.so .
          python3 -c "
          import threema_gateway_ffi as m
          m._uniffi_check_api_checksums(m._UniffiLib)
          assert m.SimpleApi is not None
          assert m.ApiError.NoCredits is not None
          print('FFI bindings load OK')
          "
